<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Awesome Obsidian Bases">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- database / table motif -->
  <g transform="translate(905 55)" opacity="0.95">
    <rect x="0" y="0" width="300" height="190" rx="12" fill="#0b1220" stroke="#334155"/>
    <rect x="0" y="0" width="300" height="34" rx="12" fill="#111c33"/>
    <circle cx="20" cy="17" r="4" fill="#f87171"/>
    <circle cx="34" cy="17" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="17" r="4" fill="#34d399"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">
      <text x="18" y="72">name</text>
      <text x="150" y="72">org</text>
      <text x="18" y="110">Ada Lovelace</text>
      <text x="150" y="110">Analytical</text>
      <text x="18" y="148">Alan Turing</text>
      <text x="150" y="148">NPL</text>
    </g>
    <g stroke="#1e293b">
      <line x1="8" y1="84" x2="292" y2="84"/>
      <line x1="8" y1="122" x2="292" y2="122"/>
      <line x1="140" y1="44" x2="140" y2="180"/>
    </g>
    <rect x="10" y="56" width="120" height="20" rx="6" fill="#34d399" opacity="0.18"/>
    <rect x="10" y="132" width="120" height="20" rx="6" fill="#a78bfa" opacity="0.18"/>
  </g>

  <text x="72" y="96" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="4" fill="#6ee7b7">CURATED · OPEN FORMAT · CC0</text>
  <text x="70" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f8fafc">Awesome Obsidian</text>
  <text x="70" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f8fafc" dy="62">Bases</text>
  <text x="72" y="250" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#cbd5e1" dy="14">Views, plugins, starter vaults and agent tooling for Obsidian's native database.</text>
</svg>
